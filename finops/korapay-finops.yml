description: >-
  FinOps view of Kora spend. Kora is a payments processor, so cost is
  transaction-based rather than a subscription or per-API-call fee: you pay a
  percentage and/or flat fee per pay-in (card, bank transfer, mobile money,
  pay-with-bank), per payout/disbursement (single, bulk, remittance), and on
  currency conversions, plus any card-issuing and identity/verification usage.
  Fees vary by product, channel, currency, and market, and can be borne by the
  merchant or passed to the customer via the merchant_bears_cost flag. Test mode
  is free. Publicly referenced figures include local Nigerian card processing
  around 1.5% per transaction, with international cards higher and payout fees
  charged as flat per-transfer amounts by tier - but these are indicative only.
notes: >-
  Per-transaction rates are NOT reconciled here and change over time and by
  market; several fees are disclosed only on request. Verify current pricing on
  korahq.com and support.korapay.com, or with your Kora account manager, during
  reconciliation. The merchant_bears_cost flag on charges and payouts determines
  whether the fee is deducted from the merchant or the customer.
