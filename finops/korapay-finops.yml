meters:
- name: payin_card
  description: Card pay-ins, billed as a percentage per transaction (indicatively ~1.5% for local NGN cards; international cards higher).
  unit: transactions
  aggregation: sum
  dimensions:
  - account
  - currency
  - card_scheme
- name: payin_bank_transfer
  description: Bank transfer / virtual bank account pay-ins, billed per transaction.
  unit: transactions
  aggregation: sum
  dimensions:
  - account
  - currency
- name: payin_mobile_money
  description: Mobile money pay-ins, billed per transaction by market.
  unit: transactions
  aggregation: sum
  dimensions:
  - account
  - currency
  - operator
- name: payout_transfer
  description: Payouts / disbursements to bank accounts and mobile money, billed as a flat fee per transfer by tier and destination.
  unit: transactions
  aggregation: sum
  dimensions:
  - account
  - currency
  - destination_type
- name: currency_conversion
  description: Multi-currency conversions, priced via the applied exchange-rate spread.
  unit: transactions
  aggregation: sum
  dimensions:
  - account
  - currency_pair
principles:
- name: Visibility
  description: Reconcile transaction fees from the Kora dashboard and webhooks; track fee per product, channel, currency, and market.
- name: Allocation
  description: Tag transactions with unique references/metadata per workload, customer, or team to map processing fees to internal cost centers.
- name: Optimization
  description: Route pay-ins to lower-cost channels where possible (for example bank transfer / virtual accounts vs card); batch disbursements via bulk payouts; use merchant_bears_cost deliberately; negotiate volume pricing at scale.
- name: Accountability
  description: Assign owners per product line; review monthly processing spend and effective take-rate against budget and against negotiated rates.
