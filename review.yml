aid: korapay
name: Kora
review:
  question: Does Kora expose a documented public WebSocket API?
  answer: false
  date: '2026-07-12'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was authored. Kora's public API is request/response
    REST over HTTPS at https://api.korapay.com/merchant/api/v1. Asynchronous
    transaction updates are delivered as webhooks (Kora POSTs to a merchant
    notification_url), authenticated with an x-korapay-signature HMAC SHA-256
    header. Webhooks are server-to-endpoint HTTP callbacks, not a server-push
    streaming transport (no WebSocket or SSE) on Kora's own API, so there is no
    in-scope AsyncAPI channel to model.
findings:
  summary: |
    Kora (formerly Korapay) does not publish a documented public WebSocket API.
    Kora is a pan-African payments infrastructure provider. Its public surface
    is a REST API under https://api.korapay.com/merchant/api/v1, authenticated
    with public (pk_) and secret (sk_) API keys across separate Test and Live
    modes. Card charge payloads are AES-256 encrypted with an encryption key.
    Asynchronous results (charge completion, payout completion, per-item bulk
    payout results) arrive as webhooks verified with an HMAC SHA-256
    x-korapay-signature header over the payload's data object. No realtime,
    bidirectional, or streaming WebSocket (ws:// or wss://) endpoint is
    documented anywhere in Kora's developer documentation as of the review date.
  authModel: |
    Two API key types: public keys (pk_, client-side, transaction-initiation
    only) and secret keys (sk_, server-side, required for financial data and all
    account operations, passed as Authorization: Bearer sk_...). Test and Live
    modes each have their own keys. Card payments require AES-256 encryption of
    the charge payload with the account encryption key and PCI DSS Level 1
    certification. Webhooks are verified with HMAC SHA-256 (x-korapay-signature)
    computed over the data object using the secret key.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://api.korapay.com/merchant/api/v1
      documented: true
      note: All documented merchant endpoints are HTTPS REST.
    - protocol: Webhook
      scheme: https
      documented: true
      note: Kora POSTs transaction/payout events to a merchant notification_url, signed with an x-korapay-signature HMAC SHA-256 header. Server-to-endpoint HTTP, not WebSocket.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented in any Kora developer documentation page as of the review date.
  endpointsConfirmedRest:
