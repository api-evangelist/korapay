    - POST https://api.korapay.com/merchant/api/v1/transactions/disburse/bulk
    - POST https://api.korapay.com/merchant/api/v1/transactions/disburse/remittance
    - GET  https://api.korapay.com/merchant/api/v1/payouts
    - GET  https://api.korapay.com/merchant/api/v1/payouts/availability
    - POST https://api.korapay.com/merchant/api/v1/virtual-bank-account
    - GET  https://api.korapay.com/merchant/api/v1/virtual-bank-account/{accountReference}
    - GET  https://api.korapay.com/merchant/api/v1/virtual-bank-account/transactions
    - GET  https://api.korapay.com/merchant/api/v1/balances
