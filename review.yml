    - GET  https://api.korapay.com/merchant/api/v1/refunds
    - POST https://api.korapay.com/merchant/api/v1/conversions/rates
    - POST https://api.korapay.com/merchant/api/v1/conversions
    - GET  https://api.korapay.com/merchant/api/v1/conversions
    - GET  https://api.korapay.com/merchant/api/v1/conversions/{reference}
    - GET  https://api.korapay.com/merchant/api/v1/misc/banks
    - POST https://api.korapay.com/merchant/api/v1/misc/banks/resolve
    - GET  https://api.korapay.com/merchant/api/v1/misc/mobile-money
    - POST https://api.korapay.com/merchant/api/v1/misc/mobile-money/resolve
    - GET  https://api.korapay.com/merchant/api/v1/misc/payout-payment-purpose-by-country-code/{countryCode}
    - GET  https://api.korapay.com/merchant/api/v1/misc/payout-countries-by-currency-code/{currencyCode}
  endpointsModeled:
    - POST https://api.korapay.com/merchant/api/v1/charges/card/authorize
  modeledNote: |
    The card-charge authorization step is documented (Kora describes submitting
    PIN / OTP / AVS / phone to an "authorize charge endpoint") but the docs link
    to a Postman entry rather than printing the literal path, so
    /charges/card/authorize is an inferred path by convention (parallel to the
    confirmed /charges/mobile-money/authorize). It is flagged in the OpenAPI
    description and should be verified against Kora's Postman collection before
    use. Request and response bodies throughout the OpenAPI are simplified
    representative schemas, not field-complete contracts. Note also a base-path
    nuance: some doc pages (conversions, pay-with-bank) print paths as
    {{baseurl}}/api/v1/... while the confirmed full-URL examples (card, refunds,
    virtual accounts, balances, mobile money) consistently use
    api.korapay.com/merchant/api/v1/...; this entry standardizes on the latter.
  webhookVerification: |
    x-korapay-signature = HMAC SHA-256 over JSON.stringify(payload.data) using
    the merchant secret key. Confirmed in Kora's webhooks documentation with
    Node.js, Java, and PHP examples.
