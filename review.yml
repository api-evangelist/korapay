    - POST https://api.korapay.com/merchant/api/v1/charges/card
    - POST https://api.korapay.com/merchant/api/v1/charges/mobile-money
    - POST https://api.korapay.com/merchant/api/v1/charges/mobile-money/authorize
    - POST https://api.korapay.com/merchant/api/v1/charge/pay-with-bank
    - GET  https://api.korapay.com/merchant/api/v1/charge/pay-with-bank/banks
    - GET  https://api.korapay.com/merchant/api/v1/charges/{reference}
