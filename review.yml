actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists. Kora's own public API is
    request/response REST plus signed HTTP webhooks. No AsyncAPI document was
    created because there is no server-push streaming transport (WebSocket or
    SSE) on Kora's own API to model; webhooks are point-to-point HTTP callbacks.
