    type: OpenAPI
  - url: collections/korapay.postman_collection.json
    type: PostmanCollection
  - url: collections/korapay.opencollection.json
    type: OpenCollection
  description: Accept payments (pay-ins) from customers. Initialize a checkout charge,
    charge cards (with encrypted card data and OTP/PIN/AVS/phone authorization),
    charge mobile money wallets and authorize them, run pay-with-bank (Instant EFT /
    direct debit) charges, and verify the final status of any charge by reference.
