aid: korapay
url: https://raw.githubusercontent.com/api-evangelist/korapay/refs/heads/main/apis.yml
name: Kora
kind: company
description: Kora (formerly Korapay) is a pan-African payments infrastructure company
  that lets businesses collect payments, disburse payouts, run settlements, issue
  cards, verify identities, and check balances across African markets. The Kora
  merchant REST API (base https://api.korapay.com/merchant/api/v1) supports pay-ins
  via card, bank transfer, mobile money, and pay-with-bank; single, bulk, and
  remittance payouts; NGN and USD virtual bank accounts; balances; refunds; and
  multi-currency conversion, with test and live modes authenticated by public and
  secret API keys and webhook events verified with an HMAC SHA-256 signature.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Payments
- Payment Gateway
- Africa
- Nigeria
- Collections
- Payouts
- Disbursements
- Virtual Bank Account
- Cards
- Fintech
created: '2026-07-12'
modified: '2026-07-12'
specificationVersion: '0.19'
